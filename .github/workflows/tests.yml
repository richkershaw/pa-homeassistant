name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No `pydantic`: the PA's protocol is not checked out here, so the stub falls back to a copy
      # of its shapes and the check that the two agree skips. A run that says "1 skipped" is the
      # expected one, and it is said out loud rather than hidden.
      - run: pip install aiohttp pytest
      - run: pytest -q
